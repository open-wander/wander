name: build

on:
  push:
    branches:
      - main
      - release/**
  workflow_call:
    inputs:
      build-ref:
        description: 'The git ref to build from'
        type: string
        default: ''
        required: false
      make-prerelease:
        description: "Run prerelease to generate files"
        type: boolean
        required: false
        default: true
      publish-release:
        description: "Publish build artifacts as a GitHub release"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      build-ref:
        description: 'The git ref to build from'
        type: string
        default: ''
        required: false
      make-prerelease:
        description: "Run prerelease to generate files"
        type: "boolean"
        required: false
        default: true
      publish-release:
        description: "Publish build artifacts as a GitHub release"
        type: "boolean"
        required: false
        default: false

env:
  PKG_NAME: "wander"
  GO_TAGS: "release"
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "open-wander/wander"

jobs:
  get-go-version:
    runs-on: ubuntu-22.04
    outputs:
      go-version: ${{ steps.get-go-version.outputs.go-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}
      - name: Determine Go version
        id: get-go-version
        # We use .go-version as our source of truth for current Go
        # version, because "goenv" can react to it automatically.
        run: |-
          echo "Building with Go $(cat .go-version)"
          echo "go-version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
  get-product-version:
    runs-on: ubuntu-22.04
    outputs:
      product-version: ${{ steps.get-product-version.outputs.product-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}
      - name: get product version
        id: get-product-version
        run: |-
          make version
          echo "product-version=$(make version)" >> "$GITHUB_OUTPUT"
  generate-metadata-file:
    needs: get-product-version
    runs-on: ubuntu-22.04
    outputs:
      filepath: ${{ steps.generate-metadata-file.outputs.filepath }}
    steps:
      - name: "Checkout directory"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}
      - name: Generate metadata file
        id: generate-metadata-file
        uses: hashicorp/actions-generate-metadata@v1.1.1
        with:
          version: ${{ needs.get-product-version.outputs.product-version }}
          product: ${{ env.PKG_NAME }}
          repositoryOwner: "open-wander"
          sha: ${{ inputs.build-ref || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: metadata.json
          path: ${{ steps.generate-metadata-file.outputs.filepath }}

  build-other:
    needs: [get-go-version, get-product-version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows]
        goarch: ["amd64"]
      fail-fast: true

    name: Go ${{ needs.get-go-version.outputs.go-version }} ${{ matrix.goos }} ${{ matrix.goarch }} build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      - name: Build dependencies
        run: make deps

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Generate UI assets
        run: |
          cd ui
          npm ci
          make build-css
          templ generate

      - name: Build prerelease
        run: make prerelease
        if: ${{ github.event_name == 'push' || inputs.make-prerelease == true }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO_TAGS: ${{ env.GO_TAGS }}
          CGO_ENABLED: 1
        run: |
          go clean -cache
          make pkg/${{ matrix.goos }}_${{ matrix.goarch }}.zip
          bash ci/verify-release-archive.sh pkg/${{ matrix.goos }}_${{ matrix.goarch }}.zip ${{ matrix.goos }}
          mv pkg/${{ matrix.goos }}_${{ matrix.goarch }}.zip ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          path: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip

  build-linux:
    needs: [get-go-version, get-product-version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: ["arm", "arm64", "amd64"]
      fail-fast: true

    name: Go ${{ needs.get-go-version.outputs.go-version }} ${{ matrix.goos }} ${{ matrix.goarch }} build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      - name: Build dependencies
        run: make deps

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Generate UI assets
        run: |
          cd ui
          npm ci
          make build-css
          templ generate

      - name: Build prerelease
        run: make prerelease
        if: ${{ github.event_name == 'push' || inputs.make-prerelease == true }}

      - name: Install Linux build utilties
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            gcc-multilib-arm-linux-gnueabihf

      - name: Set gcc
        run: |
          if [ "${{ matrix.goarch }}" == "arm" ]; then
            echo "CC=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          elif [ "${{ matrix.goarch }}" == "arm64" ]; then
            echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO_TAGS: ${{ env.GO_TAGS }}
          CGO_ENABLED: 1
        run: |
          go clean -cache
          make pkg/${{ matrix.goos }}_${{ matrix.goarch }}.zip
          bash ci/verify-release-archive.sh pkg/${{ matrix.goos }}_${{ matrix.goarch }}.zip ${{ matrix.goos }}
          mv pkg/${{ matrix.goos }}_${{ matrix.goarch }}.zip ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          path: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip

      - name: Rehearse packaged Linux lifecycle
        if: matrix.goarch == 'amd64'
        run: |
          baseline=nomad_1.6.5_linux_amd64.zip
          curl --fail --location --output "${baseline}" \
            "https://releases.hashicorp.com/nomad/1.6.5/${baseline}"
          echo "5d7836a7538808cc517ae1ee33a3ee57f908d5599adff359c250ad4170c4d4f1  ${baseline}" | sha256sum --check
          bash ci/smoke-release-ui.sh pkg/linux_amd64/wander
          bash ci/rehearse-release-lifecycle.sh \
            ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_linux_amd64.zip \
            "${baseline}"

      - name: Package
        run: |
          doc_dir=.release/linux/package/usr/share/doc/wander
          mkdir -p "$doc_dir"
          notice_dir=pkg/${{ matrix.goos }}_${{ matrix.goarch }}/.release-notices
          cp "$notice_dir/LICENSE.txt" "$doc_dir/"
          cp "$notice_dir/THIRD_PARTY_NOTICES.md" "$doc_dir/"
          cp -R "$notice_dir/licenses" "$doc_dir/"

      - name: Build native packages
        uses: hashicorp/actions-packaging-linux@v1
        with:
          name: ${{ env.PKG_NAME }}
          description: "Wander is an easy-to-use, flexible, and performant workload orchestrator that can deploy a mix of microservice, batch, containerized, and non-containerized applications."
          arch: ${{ matrix.goarch }}
          version: ${{ needs.get-product-version.outputs.product-version }}
          maintainer: "Open Wander"
          homepage: "https://github.com/open-wander/wander"
          license: "MPL-2.0"
          binary: "pkg/${{ matrix.goos }}_${{ matrix.goarch }}/${{ env.PKG_NAME }}"
          deb_depends: "openssl"
          rpm_depends: "openssl"
          config_dir: ".release/linux/package/"
          preinstall: ".release/linux/preinst"
          postinstall: ".release/linux/postinst"
          postremove: ".release/linux/postrm"

      - name: Set Package Names
        run: |
          echo "RPM_PACKAGE=$(basename out/*.rpm)" >> "$GITHUB_ENV"
          echo "DEB_PACKAGE=$(basename out/*.deb)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RPM_PACKAGE }}
          path: out/${{ env.RPM_PACKAGE }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_PACKAGE }}
          path: out/${{ env.DEB_PACKAGE }}

  build-darwin:
    needs: [get-go-version, get-product-version]
    runs-on: macos-latest
    strategy:
      matrix:
        goos: [darwin]
        goarch: ["arm64", "amd64"]
      fail-fast: true

    name: Go ${{ needs.get-go-version.outputs.go-version }} ${{ matrix.goos }} ${{ matrix.goarch }} build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      - name: Build dependencies
        run: make deps

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Generate UI assets
        run: |
          cd ui
          npm ci
          make build-css
          templ generate

      - name: Build prerelease
        run: make prerelease
        if: ${{ github.event_name == 'push' || inputs.make-prerelease == true }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO_TAGS: "${{ env.GO_TAGS }} netcgo"
          CGO_ENABLED: 1
        run: |
          go clean -cache
          make pkg/${{ matrix.goos }}_${{ matrix.goarch }}.zip
          bash ci/verify-release-archive.sh pkg/${{ matrix.goos }}_${{ matrix.goarch }}.zip ${{ matrix.goos }}
          mv pkg/${{ matrix.goos }}_${{ matrix.goarch }}.zip ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          path: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip

  build-docker:
    name: Docker ${{ matrix.arch }} build
    needs:
      - get-product-version
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: ["arm64", "amd64"]
    env:
      version: ${{needs.get-product-version.outputs.product-version}}
      revision: ${{github.sha}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}
      - name: Set revision
        if: "${{ inputs.build-ref != '' }}"
        env:
          BUILD_REF: ${{ inputs.build-ref }}
        run: |
          echo "revision=${BUILD_REF}" >> "$GITHUB_ENV"

      - name: Download Linux amd64 artifact
        if: matrix.arch == 'amd64'
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}_${{ env.version }}_linux_amd64.zip

      - name: Download Linux arm64 artifact
        if: matrix.arch == 'arm64'
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}_${{ env.version }}_linux_arm64.zip

      - name: Unzip artifact
        run: |
          unzip ${{ env.PKG_NAME }}_${{ env.version }}_linux_${{ matrix.arch }}.zip -d dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.version }}
            type=raw,value=latest,enable=${{ !contains(env.version, '-') }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WANDER_BINARY=dist/${{ env.PKG_NAME }}

  release-ui-smoke:
    name: Packaged embedded UI smoke test
    needs:
      - get-go-version
      - get-product-version
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_linux_amd64.zip
      - name: Verify archive and embedded UI runtime
        env:
          artifact_name: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_linux_amd64.zip
        run: |
          bash ci/verify-release-archive.sh "$artifact_name" linux
          unzip -q "$artifact_name" -d release-smoke
          bash ci/smoke-release-ui.sh release-smoke/wander

  minimum-os:
    name: OS Compatibility
    # A quick smoke test of our binaries on our minimum target OS (RHEL 7). Why RHEL 7? Because the glibc version is that old (2.17).
    needs:
      - get-go-version
      - get-product-version
      - build-linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # Note: Ideally we'd test all our target archs, unfortunately availability of containers of these OS's vary.
      # For instance there is no ubi7 image for arm64 (there is on ubi8), RHBZ#1728771. And none at all for arm.
      # So we have to settle for only being able to validate where we can, which is just amd64.
      matrix:
        goos: [linux]
        goarch: [amd64]
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{needs.get-go-version.outputs.go-version}}
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
      - name: Test binary
        env:
          artifact_name: ${{ env.PKG_NAME }}_${{ needs.get-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
        run: |
          echo "::group::Unpack and Prep"
          docker pull registry.access.redhat.com/ubi7/ubi-minimal:7.9-1057
          unzip "$artifact_name"
          echo "::group::Diagnostics"
          echo "CGO related build information:"
          go version -m ./wander | grep CGO
          echo "GLIBC links:"
          go tool nm ./wander | grep -i glibc | cut -d @ -f 2-3 | sort --version-sort | uniq
          echo "::group::Smoke test binary"
          docker run --rm -v "$PWD:/src" registry.access.redhat.com/ubi7/ubi-minimal:7.9-1057 /src/wander version

  publish-release:
    name: Publish GitHub release
    if: inputs.publish-release == true
    needs:
      - get-product-version
      - generate-metadata-file
      - build-other
      - build-linux
      - build-darwin
      - build-docker
      - release-ui-smoke
      - minimum-os
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Prepare release assets and checksums
        id: release
        env:
          VERSION: ${{ needs.get-product-version.outputs.product-version }}
          BUILD_REF: ${{ inputs.build-ref }}
        run: |
          if [[ -z "$BUILD_REF" ]]; then
            BUILD_REF=$(git rev-parse HEAD)
          fi
          if [[ "$VERSION" == *-dev ]]; then
            echo "::error::Refusing to publish development version $VERSION"
            exit 1
          fi

          checksum_file="wander_${VERSION}_SHA256SUMS"
          (
            cd dist
            find . -type f ! -name "$checksum_file" -print0 |
              sort -z |
              xargs -0 sha256sum
          ) >"dist/$checksum_file"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            cat >release-notes.md <<'EOF'
          This is a Wander preview release for compatibility and UI testing.
          It is not yet the stable 0.1.0 drop-in release. Known remaining work
          is tracked in `docs/plans/0.1.0-revival-checklist.md`.

          EOF
            awk '
              /^## UNRELEASED$/ { in_release = 1; next }
              in_release && /^## / { exit }
              in_release { print }
            ' CHANGELOG.md >>release-notes.md
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            awk -v version="$VERSION" '
              $0 ~ "^## " version " " { in_release = 1; next }
              in_release && /^## / { exit }
              in_release { print }
            ' CHANGELOG.md >release-notes.md
            if [[ ! -s release-notes.md ]]; then
              echo "::error::CHANGELOG.md has no section for $VERSION"
              exit 1
            fi
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "target=$BUILD_REF" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi

          mapfile -d '' assets < <(find dist -type f -print0 | sort -z)
          flags=(--target "$RELEASE_TARGET" --title "Wander ${RELEASE_TAG}" --notes-file release-notes.md)
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${flags[@]}"

permissions:
  contents: read
  id-token: write

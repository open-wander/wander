name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version being released'
        required: true
        type: string

env:
  GO_TAGS: "release"
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      build-ref: ${{ steps.commit-change-push.outputs.build-ref }}
    steps:
      - name: Prevent running from main
        if: ${{ github.ref_name == 'main' }}
        run: |-
          echo "::error::Workflow not allowed to run from ${{ github.ref_name }}"
          exit 1

      - name: Print release info
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |-
          echo "::notice::Release v${RELEASE_VERSION} from branch ${RELEASE_BRANCH}"

      - name: Validate release version
        run: |-
          if [[ ! ${RELEASE_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Version ${RELEASE_VERSION} is invalid"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Git config user/name
        run: |-
          git config --global user.email "github-team-wander-core@openwander.org"
          git config --global user.name "ow-github-team-wander-core"

      - name: Determine Go version
        id: get-go-version
        # We use .go-version as our source of truth for current Go
        # version, because "goenv" can react to it automatically.
        run: |
          echo "Building with Go $(cat .go-version)"
          echo "go-version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.get-go-version.outputs.go-version }}

      - name: Install dependencies
        run: |
          make deps

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Generate UI assets
        run: |
          cd ui
          npm ci
          make build-css
          templ generate

      - name: Update version file
        run: |
          WANDER_VERSION="${RELEASE_VERSION}"
          WANDER_MAIN_VERSION=${WANDER_VERSION%%-*}
          WANDER_PRERELEASE_VERSION=""
          if [[ ${WANDER_VERSION} == *-* ]]; then
            WANDER_PRERELEASE_VERSION=${WANDER_VERSION#*-}
          fi

          echo "updating version to ${WANDER_MAIN_VERSION}-${WANDER_PRERELEASE_VERSION}"

          sed -i.bak -e "s|\(Version * = *\"\)[^\"]*|\1${WANDER_MAIN_VERSION}|g" version/version.go
          sed -i.bak -e "s|\(VersionPrerelease * = *\"\)[^\"]*|\1${WANDER_PRERELEASE_VERSION}|g" version/version.go
          rm -rf version/version.go.bak
          git diff --color=always version/version.go

      - name: Finalize stable changelog
        run: |
          if [[ ${RELEASE_VERSION} == *-* ]]; then
            echo "Preview release: keeping the UNRELEASED changelog open"
            exit 0
          fi

          release_date=$(date '+%B %d, %Y')
          changelog_tmp=$(mktemp)
          awk -v heading="## ${RELEASE_VERSION} (${release_date})" '
            !replaced && $0 == "## UNRELEASED" { print heading; replaced = 1; next }
            { print }
            END { if (!replaced) exit 1 }
          ' CHANGELOG.md >"${changelog_tmp}"
          mv "${changelog_tmp}" CHANGELOG.md
          if grep -q '^## UNRELEASED$' CHANGELOG.md; then
            echo "::error::More than one UNRELEASED section remains"
            exit 1
          fi
          git diff --color=always CHANGELOG.md

      - name: Generate static assets
        id: generate-static-assets
        run: |
          make prerelease

      - name: Commit and push changes
        id: commit-change-push
        run: |
          git add -A .
          find . -name '*.generated.go' -not -path './vendor/*' -exec git add -f '{}' \;
          if ! git diff-index --quiet HEAD --; then
            git commit --message "Generate files for ${RELEASE_VERSION} release"
            git push origin "$(git rev-parse --abbrev-ref HEAD)"
            echo "committing generated files"
          else
            echo "no files were updated"
          fi
          echo "build-ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update version file
        run: |
          # Only bump the Version value if this is not a pre-release.
          # For final releases we want `wander -version` to display the next
          # version to indicate that the current release is done.
          if [[ ${RELEASE_VERSION} != *-* ]]; then
            IFS=. read -r major minor patch <<<"${RELEASE_VERSION}"
            next_version="${major}.${minor}.$((patch + 1))"
            sed -i.bak -e "s|\(Version * = *\"\)[^\"]*|\1${next_version}|g" version/version.go
          fi
          # Set the VersionPrerelease variable back to dev.
          sed -i.bak -e "s|\(VersionPrerelease * = *\"\)[^\"]*|\1dev|g" version/version.go
          rm -rf version/version.go.bak
          git diff --color=always version/version.go

      - name: Update LAST_RELEASE
        run: |
          # LAST_RELEASE is used to generate the new CHANGELOG entries, so it's
          # only updated for final releases.
          if [[ ${RELEASE_VERSION} != *-* ]]; then
            sed -i.bak -re "s|^(LAST_RELEASE\s+\?=\s+v).*$|\1${RELEASE_VERSION}|g" GNUmakefile
            rm -fr GNUmakefile.bak
            changelog_tmp=$(mktemp)
            printf '## UNRELEASED\n\n' >"${changelog_tmp}"
            cat CHANGELOG.md >>"${changelog_tmp}"
            mv "${changelog_tmp}" CHANGELOG.md
            git diff --color=always GNUmakefile
            git diff --color=always CHANGELOG.md
          else
            echo "Version ${RELEASE_VERSION} is a prerelease, skipping update of LAST_RELEASE"
          fi

      - name: Remove generated files
        run: |
          # These generated files are only needed when building the final
          # binary and should be not be present in the repository afterwards.
          find . -name '*.generated.go' -print0 | xargs -0 git rm
          git status

      - name: Commit post-release changes
        run: |
          # Display staged and unstaged diffs, skipping deleted files to avoid
          # cluttering the output with the generated files.
          git diff --diff-filter=d --color=always HEAD
          git add -A .
          if ! git diff-index --quiet HEAD --; then
            git commit --message 'Prepare for next release'
            git push origin "$(git rev-parse --abbrev-ref HEAD)"
          else
            echo "no files were updated"
          fi

  build-release:
    needs: prepare-release
    uses: ./.github/workflows/build.yml
    with:
      build-ref: ${{ needs.prepare-release.outputs.build-ref }}
      make-prerelease: false
      publish-release: true
    secrets: inherit
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write

permissions:
  contents: write
  id-token: write

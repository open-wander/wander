version: "2"
run:
  concurrency: 2
  timeout: 10m
  modules-download-mode: readonly
  tests: false
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - dogsled
    - durationcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      check-type-assertions: false
    gocritic:
      disabled-checks:
        - commentFormatting
        - deprecatedComment
    staticcheck:
      checks:
        - S*
        - ST1016
        - ST1020
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: ifElseChain
      - path: (.+)\.go$
        text: singleCaseSwitch
      - path: (.+)\.go$
        text: assignOp
      - path: (.+)\.go$
        text: unlambda
    paths:
      - ^ui/
      - .*\.generated\.go$
      - .*bindata_assetfs\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - ^ui/
      - .*\.generated\.go$
      - .*bindata_assetfs\.go$
      - third_party$
      - builtin$
      - examples$
